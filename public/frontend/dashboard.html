<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Dashboard</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet" />
    </head>
    <body class="container mt-4">
        <h2>Dashboard</h2>
        <div id="task-list" class="mt-4"></div>

        <nav class="d-flex justify-content-between align-items-center mb-4">
            <h2>Dashboard</h2>
            <button class="btn btn-danger" id="logout-btn">Logout</button>
        </nav>

        <form id="task-form" class="mb-4">
            <div class="row">
                <div class="col-md-6 mb-2">
                    <input type="text" class="form-control" id="title"
                        placeholder="Judul Task" required>
                </div>
                <div class="col-md-6 mb-2">
                    <input type="date" class="form-control" id="due_date"
                        required>
                </div>
            </div>
            <div class="mb-2">
                <textarea class="form-control" id="description" rows="2"
                    placeholder="Deskripsi" required></textarea>
            </div>
            <div class="mb-2">
                <select class="form-control" id="assigned_to" required>
                    <option value>Pilih User</option>
                </select>
            </div>
            <button type="submit" class="btn btn-success">Tambah Task</button>
            <div id="task-msg" class="mt-2"></div>
        </form>

        <script src="js/dashboard.js"></script>
    </body>
</html>
